# XcodeGen 工程描述
#
# 为什么用 XcodeGen 而不是提交一个 .xcodeproj：
# 因为开发机是 Windows，**无法产出一个可靠的 .xcodeproj**（那是 Xcode 的私有格式）。
# 用文本描述工程，CI 上一条 `xcodegen generate` 就能生成，而且以后工程结构变更可以 diff。
#
# ✅ 已在 CI 上验证通过（run #3：BUILD SUCCEEDED，零 error）。
#    watch app 正确嵌入 iOS app 的 Watch/ 目录，widget 以 .appex 嵌入 watch app 的 PlugIns/。

name: AppleWatchHealth

options:
  bundleIdPrefix: com.smile.intoxication  # 必须和开发者门户里注册的 App ID 前缀一致
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
    # ⚠️ 这里写 26.0 而不是 27.0 是一个**构建机制上的妥协**，不是产品决策：
    # GitHub runner 上是否有 watchOS 27 SDK 我们无法预先确定，如果这里硬写 27.0，
    # 一旦 runner 只有 watchOS 26 SDK，xcodebuild 会在校验部署目标时**立刻失败**。
    # 所以：项目基线设 26.0，CI 会探测实际 SDK 版本并用 WATCHOS_DEPLOYMENT_TARGET
    # 覆盖成 27.x。deployment target 是"最低支持版本"，不影响在 watchOS 27 设备上运行。
    watchOS: "26.0"

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"                # ← 先用 Swift 5 语言模式，避免并发标注刷屏
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:

  # ============================================================
  # iOS 配套 App
  # ============================================================
  AppleWatchHealth:
    type: application
    platform: iOS
    sources:
      - path: ios
        excludes:
          - PrivacyInfo.xcprivacy
      # ★ 跨设备共享代码（仓库根的 `shared/`）。
      #   注意它和下面的 `watch/Shared` 是**两个不同的东西**，别混：
      #     · shared/       = 手表 ↔ iPhone 之间共享（指标元数据、传输协议）
      #     · watch/Shared  = 手表 app ↔ 表盘小组件之间共享（App Group 快照）
      #   两者都必须**只依赖 Foundation**，自检脚本第 11 节会守住这条。
      #   iOS app 拿它来把 metricID 翻成标题/单位/小数位
      #   —— 因为线上只传 metricID，不传展示字段。
      - path: shared
      # 隐私清单必须显式作为**资源**拷进 bundle 根目录
      - path: ios/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: ios/Info.plist
      properties:
        CFBundleDisplayName: 长明护心
        # ⚠️ 必须显式写成 $(...) 形式。XcodeGen 生成 Info.plist 时会把
        #    CFBundleShortVersionString / CFBundleVersion 硬编码成**字面量** "1.0" / "1"，
        #    不写这两行的话，改 MARKETING_VERSION 对产物**完全无效**——
        #    现在恰好是 1.0/1 所以看不出来，等要发 1.1 时才会以「版本号未递增」的形式炸出来。
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # 一次性免掉每次上传都要回答的"出口合规（是否使用加密）"问题
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smile.intoxication.applewatchhealth
        CODE_SIGN_ENTITLEMENTS: ios/iOSApp.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        # ⚠️ 必须显式指定，XcodeGen 不会替你设这个（Xcode 新建工程时模板才会带）。
        #    它是 actool 的 --app-icon 参数来源，不设的话：
        #      · 不生成 CFBundleIconName → 上传报 "Missing Info.plist value"
        #      · 不派生 120x120 → 上传报 "Missing required icon file"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      # ✅ 已验证正确（run #3 的成功日志）：
      #    Copy .../Debug-iphoneos/AppleWatchHealth.app/Watch/AppleWatch Health App.app
      #    并且通过了 ValidateEmbeddedBinary。
      #    即 XcodeGen 自动用了 dstSubfolderSpec=16 + dstPath="$(CONTENTS_FOLDER_PATH)/Watch"。
      - target: AppleWatchHealth Watch App
        embed: true
        codeSign: true
        copy:
          destination: productsDirectory
          subpath: "$(CONTENTS_FOLDER_PATH)/Watch"
    scheme:
      testTargets: []

  # ============================================================
  # watchOS App（本项目的主体）
  # ============================================================
  AppleWatchHealth Watch App:
    type: application
    platform: watchOS
    sources:
      - path: watch/App
      - path: watch/Health
      - path: watch/Storage
      - path: watch/Shared
      - path: watch/Upload
      # ★ 跨设备共享代码：指标展示元数据（MetricDisplay）+ 传输协议
      #   （UploadPayload / SampleBatch）。和 iPhone 端编的是同一份源码，
      #   这样"手表发的"和"手机解的"不可能对不上。
      - path: shared
      # App 图标 asset catalog（只放一张 1024x1024，actool 自动派生全部尺寸）。
      # 由 `python ci/make-app-icon.py` 生成，可复现、可 review。
      - path: watch/Assets.xcassets
      # 隐私清单：本 target 用到 UserDefaults，必须声明 required reason（CA92.1）。
      # Apple 原文：2024-05-01 起，未在隐私清单里声明 required reason API 的 app
      # **不被 App Store Connect 接受**。
      - path: watch/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: watch/App/Info.plist
      properties:
        CFBundleDisplayName: 长明护心
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.smile.intoxication.applewatchhealth
        WKRunsIndependentlyOfCompanionApp: true
        # 缺这两个键会在请求授权时直接崩溃
        NSHealthShareUsageDescription: 用于读取你的心率、HRV、血氧、睡眠等健康数据，并显示在手表和表盘上。
        NSHealthUpdateUsageDescription: 本 App 不会向健康 App 写入数据。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smile.intoxication.applewatchhealth.watchkitapp
        CODE_SIGN_ENTITLEMENTS: watch/WatchApp.entitlements
        TARGETED_DEVICE_FAMILY: "4"
        # 同 iOS：不设这个就不会生成 CFBundleIconName / CFBundleIconFiles，
        # 上传时会报 "Missing Icons. No icons found for watch application"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      # ✅ 已验证正确（run #3 的成功日志）：
      #    产物是 .appex（不是 .app），被 Copy 进 watch app 的 PlugIns/，
      #    并通过了 ValidateEmbeddedBinary。XcodeGen 对 app-extension 类型默认就 embed 到 PlugIns。
      - target: AppleWatchHealth Widget
        embed: true
        codeSign: true
    scheme: {}

  # ============================================================
  # watchOS Widget Extension（表盘小组件）
  # ============================================================
  AppleWatchHealth Widget:
    type: app-extension
    platform: watchOS
    sources:
      - path: watch/Widget
        excludes:
          - PrivacyInfo.xcprivacy
      # ⚠️ 小组件是**独立 target**，用到的共享类型必须显式加进来，
      #    否则会报 "cannot find type ... in scope"（第一次 CI 就是这么挂的）。
      #    watch/Shared 里只有 Foundation 依赖的代码（快照结构 + 读写工具），
      #    **不含 HealthKit** —— 小组件本来就不该有 HealthKit 权限。
      - path: watch/Shared
      - path: watch/Widget/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      # WidgetKit 扩展需要 Info.plist 里有嵌套的 NSExtension 字典，
      # 所以这里必须用 info.properties 显式写，不能用 INFOPLIST_KEY_ 构建设置。
      path: watch/Widget/Info.plist
      properties:
        CFBundleDisplayName: 长明护心
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smile.intoxication.applewatchhealth.watchkitapp.widget
        CODE_SIGN_ENTITLEMENTS: watch/Widget.entitlements
        TARGETED_DEVICE_FAMILY: "4"
