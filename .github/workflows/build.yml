name: Build

# 用法：
#   - push 到 main 会自动跑「编译检查」（不需要签名、不需要任何密钥）
#   - 想打包上传 TestFlight 时，二选一：
#       a) Actions → Build → Run workflow → mode 选 testflight
#       b) 推一个 v* 的 tag（例如 `git tag v1.0 && git push origin v1.0`）
#     (b) 是为了让助手也能触发上传——workflow_dispatch 需要 API token，助手没有。
#
# 关于 runner：
#   第一次跑请看「打印可用 Xcode」的输出，确认镜像里有没有带 watchOS 27 SDK 的 Xcode。
#   如果没有，需要换 runner 标签或等 GitHub 更新镜像。

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: "compile = 只编译检查；testflight = 打包并上传 TestFlight"
        type: choice
        options: [compile, testflight]
        default: compile

# 编译失败时要把诊断信息发成 Issue，所以需要 issues: write
permissions:
  contents: read
  issues: write

jobs:
  # ============================================================
  # 阶段①：编译检查（零成本，不需要 Apple 账号、不需要证书）
  # ============================================================
  compile:
    name: 编译检查（跳过签名）
    runs-on: macos-15
    if: (github.event_name != 'workflow_dispatch' || inputs.mode == 'compile') && !startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4

      # 结构性自检：不依赖 Xcode，几秒就能跑完。
      # 故意放在最前面 —— 这些不变量一旦坏掉，后面整条构建链会「绿着但错着」
      # （比如隐私清单没接进 bundle、版本号被硬编码，编译都不会报错）。
      - name: 结构性自检
        run: bash ci/verify-project.sh

      - name: 打印可用 Xcode
        run: |
          echo "=== /Applications 下的 Xcode ==="
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "（没有找到 Xcode）"
          echo "=== 当前默认版本 ==="
          xcodebuild -version || true
          echo "=== 可用 SDK（关注 watchos 版本）==="
          xcodebuild -showsdks 2>/dev/null | grep -i watch || true

      - name: 选择最新 Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "使用: $latest"
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: |
          xcodegen generate --spec project.yml
          echo "=== 生成的 targets / schemes ==="
          xcodebuild -list -project AppleWatchHealth.xcodeproj

      - name: 探测 watchOS SDK
        id: sdk
        run: |
          SDK=$(xcodebuild -showsdks 2>/dev/null \
            | grep -oE 'watchos[0-9]+(\.[0-9]+)?' \
            | sed 's/watchos//' | sort -V | tail -1)
          if [ -z "$SDK" ]; then
            echo "没有找到任何 watchOS SDK"
            xcodebuild -showsdks
            exit 1
          fi
          MAJOR=${SDK%%.*}
          echo "detected=$SDK" >> "$GITHUB_OUTPUT"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
          echo "最高 watchOS SDK：$SDK（主版本 $MAJOR）"

      - name: 编译（CODE_SIGNING_ALLOWED=NO）
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          SDK="${{ steps.sdk.outputs.detected }}"
          MAJOR="${{ steps.sdk.outputs.major }}"
          # ⚠️ 这里**刻意不再**根据 SDK 版本定义 HAS_WATCHOS_27_SDK 之类的编译条件。
          #    原因：那种做法会造成「CI 验证过的配置 ≠ 实际发货的配置」——
          #    RMSSD 曾经就被 #if HAS_WATCHOS_27_SDK 门控，而 CI 上从未成立，
          #    于是它**从来没被编译进去过**，却一直是绿的。
          #    现在 watchOS 27 专属类型改用原始字符串构造（见 MetricCatalog.rmssdIdentifier），
          #    老 SDK 也能编译、新系统上运行时可用 —— 不再需要任何编译条件。
          #    代价是写错字符串不会编译报错，所以自检脚本会守住这一点。
          echo "watchOS SDK：$SDK（主版本 $MAJOR）"
          xcodebuild build \
            -project AppleWatchHealth.xcodeproj \
            -scheme "AppleWatchHealth" \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            WATCHOS_DEPLOYMENT_TARGET="$SDK" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log

      # ------------------------------------------------------------
      # 构建产物断言：**编译通过 ≠ 产物正确**。
      # 下面这几类是「编译不报错、但上架或运行会出问题」的，必须显式验证。
      # ------------------------------------------------------------
      - name: 断言构建产物（隐私清单 / 版本号 / 嵌入关系）
        if: steps.build.outcome == 'success'
        run: |
          # 关掉 -e：断言失败要走到最后的统一汇总再统一 exit 1，
          # 不要在中途某个命令返回非零时就静默退出（那样只看得到"失败了"看不到全貌）
          set +e
          PRD=build/DerivedData/Build/Products
          APP="$PRD/Debug-iphoneos/AppleWatchHealth.app"

          # ⚠️ 不要硬编码 watch app / widget 的产物名。
          #    它们由 target 名派生（target "AppleWatchHealth Watch App" -> "AppleWatchHealth Watch App.app"），
          #    手写极容易少/多一个空格 —— 这段断言第一次写就是栽在这里
          #    （写成了 "AppleWatch Health App.app"，多了个空格，于是断言自己失败了）。
          #    改成"在预期目录里找唯一的那一个"，以后 target 改名也不会误报。
          WATCH=$(find "$APP/Watch" -maxdepth 1 -name '*.app' 2>/dev/null | head -1)
          WIDGET=$(find "$WATCH/PlugIns" -maxdepth 1 -name '*.appex' 2>/dev/null | head -1)

          FAIL=0
          chk() { if [ -e "$1" ]; then echo "  OK   $2"; else echo "  FAIL $2  -> $1"; FAIL=1; fi }

          echo "== 产物存在性与嵌入关系 =="
          chk "$APP" "iOS app"
          if [ -n "$WATCH" ]; then
            chk "$WATCH" "watch app 嵌在 iOS app 的 Watch/ 下"
          else
            echo "  FAIL Watch/ 下没有找到 .app"; FAIL=1
          fi
          if [ -n "$WIDGET" ]; then
            chk "$WIDGET" "widget 以 .appex 嵌在 watch app 的 PlugIns/ 下"
          else
            echo "  FAIL PlugIns/ 下没有找到 .appex"; FAIL=1
          fi

          echo "== 隐私清单必须出现在每个 bundle 根目录（缺了 App Store Connect 会拒收）=="
          for B in "$APP" "$WATCH" "$WIDGET"; do
            [ -n "$B" ] && chk "$B/PrivacyInfo.xcprivacy" "$(basename "$B") 的隐私清单"
          done

          echo "== 版本号必须真的来自 MARKETING_VERSION =="
          EXPECT=$(grep -oE 'MARKETING_VERSION: "[^"]+"' project.yml | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "  project.yml 里期望的版本：${EXPECT:-（没找到）}"
          for B in "$APP" "$WATCH" "$WIDGET"; do
            [ -z "$B" ] && continue
            P="$B/Info.plist"
            V=$(plutil -extract CFBundleShortVersionString raw "$P" 2>/dev/null || echo "?")
            BVER=$(plutil -extract CFBundleVersion raw "$P" 2>/dev/null || echo "?")
            echo "  $(basename "$B") -> $V ($BVER)"
            if [ -n "$EXPECT" ] && [ "$V" != "$EXPECT" ]; then
              echo "  FAIL 版本号 $V != MARKETING_VERSION $EXPECT（说明被 XcodeGen 硬编码了）"
              FAIL=1
            fi
          done

          if [ "$FAIL" -ne 0 ]; then
            echo "产物断言未通过"
            exit 1
          fi
          echo "产物断言全部通过"

      # ------------------------------------------------------------
      # 下面两步只在编译失败时跑：把诊断信息发成一个 Issue。
      # Issue 是公开可读的，所以即使开发者没有 Mac、看不到设备日志，
      # 也能远程（让 AI 助手）读出真实的编译错误。
      # ------------------------------------------------------------
      - name: 收集环境诊断
        # ⚠️ 用 failure() 而不是 steps.build.outcome == 'failure'：
        #    brew / xcode-select / xcodegen / SDK 探测 这些步骤也可能失败，
        #    那时 steps.build 是 skipped 而不是 failure，诊断就完全不会跑
        #    —— 而「runner 换镜像后没有 watchOS SDK」恰恰是最需要远程诊断的情况。
        if: failure()
        run: |
          # ⚠️ 诊断步骤本身**绝不能**因为"没找到 error"之类的原因失败。
          #    run #6 的教训：产物断言失败 → 诊断步骤也失败 → ci-report.md 没生成
          #    → Issue 没建成，结果"为什么失败"这个最关键的信息完全丢失。
          #    诊断代码必须比被诊断的代码更宽容。
          set +e
          # 前面的步骤失败时可能还没有 build.log，先建空的，免得后面二次失败
          [ -f build.log ] || : > build.log
          {
            echo "### Xcode 版本"
            xcodebuild -version
            echo ""
            echo "### /Applications 下的 Xcode"
            ls -d /Applications/Xcode*.app
            echo ""
            echo "### 可用 SDK"
            xcodebuild -showsdks | grep -iE "watch|ios"
            echo ""
            echo "### 工程 targets / schemes"
            xcodebuild -list -project AppleWatchHealth.xcodeproj
          } > ci-env.txt 2>&1
          echo "环境诊断已写入 ci-env.txt（含 stderr）"

      - name: 发布失败诊断到 Issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 同样必须宽容：这一步存在的意义就是**保留失败信息**，
          # 它自己失败会让真实原因彻底消失（run #6 就是这样）
          set +e
          [ -f ci-env.txt ] || echo "（环境诊断步骤没有生成 ci-env.txt）" > ci-env.txt
          [ -f build.log ]  || echo "（没有 build.log：失败发生在编译之前）" > build.log

          {
            echo "# CI 失败诊断"
            echo ""
            echo "- 运行编号：#${{ github.run_number }}（第 ${{ github.run_attempt }} 次尝试）"
            echo "- 提交：\`${{ github.sha }}\`"
            echo "- 运行日志：https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "> ⚠️ 失败**不一定**是编译错误。结构性自检、产物断言、依赖安装、"
            echo "> SDK 探测失败都会走到这里，而那时编译错误列表是空的 ——"
            echo "> 遇到空列表请重点看第 1 节环境和第 3 节日志末尾。"
            echo ""
            echo "## 1. 环境"
            echo ""
            echo '```'
            cat ci-env.txt
            echo '```'
            echo ""
            echo "## 2. 编译错误（去重，最多 100 条）"
            echo ""
            echo '```'
            ERRORS=$(grep -E "error: " build.log | sed 's|.*/SmileLife/||' | sort -u | head -n 100)
            if [ -n "$ERRORS" ]; then
              echo "$ERRORS"
            else
              echo "（没有匹配到 error: —— 说明失败不是编译引起的）"
            fi
            echo '```'
            echo ""
            echo "## 3. 日志末尾 100 行"
            echo ""
            echo '```'
            tail -n 100 build.log
            echo '```'
          } > ci-report.md

          # GitHub Issue 正文上限 65536 字符。超了 gh 会直接拒绝，
          # 而且是在"正在报错"的时候报错，信息就又丢了。截断到安全长度。
          head -c 60000 ci-report.md > ci-report.trimmed.md

          gh issue create \
            --repo "${{ github.repository }}" \
            --title "CI 失败：run #${{ github.run_number }}" \
            --body-file ci-report.trimmed.md \
            || echo "⚠️ 建 Issue 失败（可能缺 issues:write 权限），详情见 job 的 Job Summary"

      - name: 提取错误摘要到 Job Summary
        if: always()
        run: |
          {
            echo "## 编译结果"
            echo ""
            if [ -f build.log ]; then
              echo "### 错误（去重）"
              echo '```'
              grep -E "error: " build.log | sed 's|.*/SmileLife/||' | sort -u | head -n 80 || echo "（没有匹配到 error:）"
              echo '```'
              echo "### 警告数量"
              echo '```'
              grep -c "warning: " build.log || echo 0
              echo '```'
            else
              echo "没有生成 build.log"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传完整日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: 编译是否通过
        if: steps.build.outcome == 'failure'
        run: |
          echo "编译失败。诊断信息已发成 Issue（仓库的 Issues 页签）。"
          exit 1

  # ============================================================
  # 阶段③：打包 + 上传 TestFlight
  # 需要先在仓库 Secrets 里配置（见 docs/无Mac打包部署指南.md）：
  #   TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY
  # ============================================================
  testflight:
    name: 打包并上传 TestFlight
    runs-on: macos-15
    # 手动触发（mode=testflight）或推 v* tag —— 后者让助手也能触发上传
    if: (github.event_name == 'workflow_dispatch' && inputs.mode == 'testflight') || startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      # 和 compile job 跑同一份自检 —— 发货前再确认一次不变量没被破坏
      - name: 结构性自检
        run: bash ci/verify-project.sh

      - name: 检查密钥是否配好
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          missing=0
          for v in TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY; do
            if [ -z "${!v}" ]; then echo "缺少 secret: $v"; missing=1; fi
          done
          if [ "$missing" = "1" ]; then
            echo "请先按 docs/无Mac打包部署指南.md 配置 Secrets。"
            exit 1
          fi
          echo "密钥齐备"

      - name: 选择最新 Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 写入 App Store Connect API Key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$ASC_PRIVATE_KEY" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: 生成工程
        run: xcodegen generate --spec project.yml

      # ⚠️ compile job 里也有一段同样的探测。两个 job 必须用同一套编译设置，
      #    否则会出现「CI 验证过的配置 ≠ 实际发货的配置」。
      #    （历史教训：RMSSD 曾被 #if HAS_WATCHOS_27_SDK 门控，而那个条件在 CI 上
      #      从未成立，于是它从没被编进任何产物，却一直是绿的。现在不再需要编译条件。）
      - name: 探测 watchOS SDK
        id: sdk
        run: |
          SDK=$(xcodebuild -showsdks 2>/dev/null \
            | grep -oE 'watchos[0-9]+(\.[0-9]+)?' \
            | sed 's/watchos//' | sort -V | tail -1)
          if [ -z "$SDK" ]; then
            echo "没有找到任何 watchOS SDK"
            xcodebuild -showsdks
            exit 1
          fi
          MAJOR=${SDK%%.*}
          echo "detected=$SDK" >> "$GITHUB_OUTPUT"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
          echo "最高 watchOS SDK：$SDK（主版本 $MAJOR）"

      - name: Archive
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          SDK="${{ steps.sdk.outputs.detected }}"
          echo "watchOS SDK：$SDK"
          xcodebuild archive \
            -project AppleWatchHealth.xcodeproj \
            -scheme "AppleWatchHealth" \
            -destination 'generic/platform=iOS' \
            -archivePath build/AppleWatchHealth.xcarchive \
            -derivedDataPath build/DerivedData \
            WATCHOS_DEPLOYMENT_TARGET="$SDK" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee archive.log

      - name: 导出 .ipa
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/AppleWatchHealth.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ci/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee export.log

      - name: 上传导出目录内容
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: export
          # ⚠️ 这里**不能**用 if-no-files-found: error。
          #    ExportOptions.plist 里是 destination=upload，xcodebuild 会**直接上传**
          #    到 App Store Connect，不会在 build/export/ 留下 .ipa。
          #    用 error 的话会出现「TestFlight 上传成功了，但 job 变红」这种最坏的信号。
          #    想要可下载的 .ipa，需要另跑一次 -exportArchive（destination=export）。
          path: build/export/
          if-no-files-found: warn

      - name: 上传过程日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sign-logs
          path: |
            archive.log
            export.log
          if-no-files-found: warn

      # ------------------------------------------------------------
      # 签名失败诊断。
      # compile job 一直有诊断，但 testflight job **之前没有** ——
      # 后果是 run #8 失败时仓库里连 Issue 都没有，只能靠人肉下载 artifact。
      # 在"开发者没有 Mac、看不到日志"这个前提下，这是致命的。
      # ------------------------------------------------------------
      - name: 收集签名诊断
        if: failure()
        run: |
          set +e
          [ -f archive.log ] || echo "（没有 archive.log：失败发生在 archive 之前）" > archive.log
          [ -f export.log ]  || echo "（没有 export.log：失败发生在导出之前）" > export.log

          # ——— 原始信息（会被放进代码块里）———
          {
            echo "### Xcode 版本"
            xcodebuild -version
            echo ""
            echo "### 可用 SDK"
            xcodebuild -showsdks | grep -iE "watch|ios"
            echo ""
            echo "### archive.log 里的 error"
            grep -E "error: " archive.log
            echo ""
            echo "### export.log 里的 error"
            grep -E "error: " export.log
          } > sign-env.txt 2>&1

          # ——— 把 Apple 的原始报错翻译成"该去点哪里" ———
          # 单独放一个 .md（不套代码块），这样在 Issue 里能正常渲染。
          : > sign-hints.md
          if grep -q "doesn't match the entitlements file's value for the com.apple.security.application-groups" archive.log export.log 2>/dev/null; then
            {
              echo "## 🔎 识别到：App Group 没有在开发者门户里配好"
              echo ""
              echo "**报错**（provisioning profile 里没有 App Groups 能力，"
              echo "而 watch app / widget 的 entitlements 都要求了它。"
              echo "自动签名无法给一个「账户里不存在」的 App Group 生成描述文件）："
              echo ""
              echo '```'
              grep -h "doesn't match the entitlements" archive.log export.log | sort -u
              echo '```'
              echo ""
              echo "**修法（只能网页操作，改完重跑本 workflow，不需要改代码）**："
              echo ""
              echo "1. 打开 developer.apple.com/account → **Certificates, Identifiers & Profiles** → **Identifiers**"
              echo "2. 确认 **App Groups** 里已注册 \`group.com.smile.intoxication.applewatchhealth\`（没有就 ＋ 新建）"
              echo "3. 逐个打开下面**两个 App ID**（列表里没有就 ＋ 新建 App IDs），"
              echo "   勾上 **App Groups** → **Configure** → 选中上面那个 group → **Save**："
              echo "   - \`com.smile.intoxication.applewatchhealth.watchkitapp\`"
              echo "   - \`com.smile.intoxication.applewatchhealth.watchkitapp.widget\`"
              echo "4. 顺手确认 watch app 那个 App ID 也勾了 **HealthKit**"
              echo ""
            } >> sign-hints.md
          fi
          if grep -q "Cloud signing permission error" archive.log export.log 2>/dev/null; then
            {
              echo "## 🔎 识别到：API Key 没有「云端分发签名」权限"
              echo ""
              echo "**注意这已经是好消息了** —— archive 阶段是 \`** ARCHIVE SUCCEEDED **\`，"
              echo "说明 entitlements / App Group / HealthKit 的配置**全部正确**，"
              echo "开发证书也创建成功了（\`Apple Development: Created via API\`）。"
              echo ""
              echo "卡住的是 **export**：它需要**分发**证书，而"
              echo "cloud-managed **distribution** certificate 要求 **Admin 角色**的 Team Key，"
              echo "App Manager 不够。（依据：Apple 开发者论坛 thread 810658 / 698117）"
              echo ""
              echo "**修法**："
              echo ""
              echo "1. 打开 appstoreconnect.apple.com → **Users and Access** → **Integrations**"
              echo "2. 确认你在 **Team Keys** 标签页，**不是 Individual Keys**"
              echo "   —— 个人密钥（Individual Keys）**完全不支持**云端签名"
              echo "3. 新建一个 key，**Access / Role 选 Admin**（不是 App Manager）→ Generate → **下载 .p8**"
              echo "   （.p8 只能下载一次）"
              echo "4. 更新 GitHub Secrets：\`ASC_KEY_ID\` 和 \`ASC_PRIVATE_KEY\`"
              echo "   \`ASC_ISSUER_ID\` 和 \`TEAM_ID\` **不用改** —— Issuer ID 是团队级的，不随 key 变"
              echo "5. 重跑 workflow"
              echo ""
            } >> sign-hints.md
          fi
          if grep -qE "No signing certificate|requires a provisioning profile" archive.log export.log 2>/dev/null; then
            {
              echo "## 🔎 识别到：签名证书 / 描述文件缺失"
              echo ""
              echo "多半是 **App Store Connect API Key 权限不够**。"
              echo "去 appstoreconnect.apple.com → Users and Access → Integrations → **Team Keys**，"
              echo "确认它**是 Team Key** 且角色是 **Admin**。"
              echo ""
            } >> sign-hints.md
          fi
          if grep -q "suitable application records" archive.log export.log 2>/dev/null; then
            {
              echo "## 🔎 识别到：App Store Connect 里还没有这个 App 记录"
              echo ""
              echo "去 appstoreconnect.apple.com → **My Apps** → ＋ → **New App**，"
              echo "Bundle ID 选 \`com.smile.intoxication.applewatchhealth\`。"
              echo ""
            } >> sign-hints.md
          fi

          echo "签名诊断已写入 sign-env.txt / sign-hints.md"

      - name: 发布失败诊断到 Issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          [ -f sign-env.txt ]   || echo "（签名诊断步骤没有生成 sign-env.txt）" > sign-env.txt
          [ -f sign-hints.md ]  || : > sign-hints.md

          {
            echo "# TestFlight 打包失败诊断"
            echo ""
            echo "- 运行编号：#${{ github.run_number }}（第 ${{ github.run_attempt }} 次尝试）"
            echo "- 提交：\`${{ github.sha }}\`"
            echo "- 运行日志：https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            cat sign-hints.md
            echo "## 1. 环境与 error"
            echo ""
            echo '```'
            cat sign-env.txt
            echo '```'
            echo ""
            echo "## 2. archive.log 末尾 40 行"
            echo ""
            echo '```'
            tail -n 40 archive.log
            echo '```'
            echo ""
            echo "## 3. export.log 末尾 40 行"
            echo ""
            echo '```'
            tail -n 40 export.log
            echo '```'
          } > sign-report.md
          head -c 60000 sign-report.md > sign-report.trimmed.md

          gh issue create \
            --repo "${{ github.repository }}" \
            --title "TestFlight 打包失败：run #${{ github.run_number }}" \
            --body-file sign-report.trimmed.md \
            || echo "⚠️ 建 Issue 失败（可能缺 issues:write 权限），详情见 job 的 Job Summary"
